all: True
recursive: True
disable-version-string: True
mockname: "{{.InterfaceName}}"
filename: "mock_{{.InterfaceName}}.go"
with-expecter: False
outpkg: "mocks"
packages:
  
  Encargalo.app-api.go/internal/pkg/cookie:
    config:
      dir: "internal/mocks/pkg/cookie"

  Encargalo.app-api.go/internal/shared/jwt:
    config:
      dir: "internal/mocks/shared/jwt"    

  Encargalo.app-api.go/internal/auth/handler:
    config:
      dir: "internal/mocks/auth/handler"

  Encargalo.app-api.go/internal/auth/domain/ports:
    config:
      dir: "internal/mocks/auth/domain/ports"

  Encargalo.app-api.go/internal/users/handler:
    config:
      dir: "internal/mocks/users/handler"

  Encargalo.app-api.go/internal/users/domain/ports:
    config:
      dir: "internal/mocks/users/domain/ports"

  Encargalo.app-api.go/internal/products/domain/ports:
    config:
      dir: "internal/mocks/products/domain/ports"

  Encargalo.app-api.go/internal/employee/domain/ports:
    config:
      dir: "internal/mocks/employee/domain/ports"
