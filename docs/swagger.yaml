  /trips:
    post:
      consumes:
      - application/json
      description: 'Crea un viaje a partir de una cotización vigente. Un método solo:
        PagoMovil (comprobante, payment_review), Balance (debita la tarifa, searching)
        o Efectivo (el pasajero paga al rider, searching). También dos métodos con
        balance_amount_bs y/o cash_amount_bs: el resto lo cubre el method_payment.
        Los tres juntos se rechazan. Si hay Pago Móvil, el viaje no se oferta hasta
        aprobar el comprobante. id (UUID v4, opcional) es la llave de idempotencia:
        la app lo genera una vez por intento y lo reenvía igual si la respuesta se
        pierde; un reintento con el mismo id devuelve el viaje ya creado (201, en
        su estado actual) sin volver a cobrar, subir el comprobante ni ofertarlo.
        Si el servidor respondió un error, el siguiente intento debe usar un id nuevo.'
      parameters:
      - description: quote_id y method_payment (PagoMovil con comprobante, Balance,
          o Efectivo)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_trips_domain_dtos.CreateTripRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_trips_domain_dtos.TripResponse'
        "400":
          description: payload inválido
          schema:
            type: string
        "401":
          description: No autorizado
          schema:
            type: string
        "404":
          description: Cotización no encontrada, expirada o de otro cliente
          schema:
            type: string
        "409":
          description: El id ya lo usa un viaje de otro cliente
          schema:
            type: string
        "422":
          description: No se pudo subir el comprobante o saldo insuficiente
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Solicitar un viaje
      tags:
      - Trips
  /trips/{id}:
    get:
      description: Si el viaje ya tiene rider asignado, `rider` trae nombre, teléfono,
        foto y vehículo. No incluye documentos KYC. pickup_code aparece desde accepted
        hasta que el pasajero sube; dropoff_code aparece en in_progress. Si un Pago
        Móvil aprobado se reintegró a la cartera, `payment` trae transaction_id, credited_bs
        y refund_eligible_until. Los cambios en vivo llegan por GET /trips/live.
      parameters:
