  Encargalo_app-api_go_internal_orders_domain_dtos.CreateOrder:
    properties:
      address:
        $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.Address'
      balance_amount_bs:
        description: |-
          BalanceAmountBs es opcional, en bolívares (balance del customer es Bs).
          0 = no usar balance. Si > 0 se valida (con la tasa BCV del quote) que
          equivalga a >= $1 y <= min(balance disponible, total de la orden). Si
          cubre el total no se requiere comprobante.
        example: 148.5
        type: number
      cash_amount_bs:
        description: |-
          CashAmountBs es la parte en efectivo, en bolívares. 0 = el resto se
          infiere: con Efectivo y saldo, el efectivo es lo que el saldo no cubre.
        example: 200
        type: number
      expected_total_price:
        description: |-
          ExpectedTotalPrice (legacy sin quote): total que el front mostró.
          Con quote_id se ignora. Sin quote_id sigue siendo obligatorio.
        example: 18.5
        type: number
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      items:
        items:
          $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.CreateItemsOrder'
        type: array
      method_payment:
        enum:
        - PagoMovil
        - Efectivo
        example: PagoMovil
        type: string
      payment_proof_image:
        description: 7_000_000 ~ 5MB (límite del front) en base64.
        example: data:image/jpeg;base64,/9j/4AAQ...
        maxLength: 7000000
        type: string
      quote_id:
        description: |-
          QuoteID congela el total en el servidor (POST /orders/quote). Si viene,
          shop/address/items/expected_total_price se toman del quote (pueden omitirse).
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      shop_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    required:
    - id
    - method_payment
    type: object
  Encargalo_app-api_go_internal_orders_domain_dtos.CreateOrderResponse:
