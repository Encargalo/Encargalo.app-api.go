definitions:
  Encargalo_app-api_go_internal_auth_handler_request.SignInRequest:
    properties:
      password:
        example: claveSegura123
        type: string
      phone_number:
        example: "+573001112233"
        type: string
    required:
    - password
    - phone_number
    type: object
  Encargalo_app-api_go_internal_orders_domain_dtos.Address:
    properties:
      address:
        example: 'Calle 123 # 45-67'
        type: string
      latitude:
        example: 37.7749
        type: number
      longitude:
        example: -74.08175
        type: number
    required:
    - address
    - latitude
    - longitude
    type: object
  Encargalo_app-api_go_internal_orders_domain_dtos.CreateAdditionsOrders:
    properties:
      addition_id:
        type: string
    type: object
  Encargalo_app-api_go_internal_orders_domain_dtos.CreateItemsOrder:
    properties:
      additions:
        items:
          $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.CreateAdditionsOrders'
        type: array
      amount:
        type: integer
      flavors:
        additionalProperties:
          type: integer
        type: object
      item_id:
        type: string
      observation:
        type: string
    required:
    - amount
    - item_id
    type: object
  Encargalo_app-api_go_internal_orders_domain_dtos.CreateOrder:
    properties:
      address:
        $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.Address'
      delivery_fee:
        example: 5000
        type: integer
      id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      items:
        items:
          $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.CreateItemsOrder'
        type: array
      method_payment:
        enum:
        - Nequi
        - Efectivo
        example: Nequi
        type: string
      shop_id:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
    required:
    - address
    - delivery_fee
    - id
    - items
    - method_payment
    - shop_id
    type: object
  Encargalo_app-api_go_internal_orders_domain_dtos.ErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      message:
        example: invalid request
        type: string
    type: object
  Encargalo_app-api_go_internal_products_domain_dtos.AdditionResponse:
    properties:
      bs:
        type: number
      id:
        type: string
      name:
        type: string
      ref:
        type: number
    type: object
  Encargalo_app-api_go_internal_products_domain_dtos.CategoryResponse:
    properties:
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.ItemResponse'
        type: array
      name:
        type: string
      shop_id:
        type: string
    type: object
  Encargalo_app-api_go_internal_products_domain_dtos.FlavorResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  Encargalo_app-api_go_internal_products_domain_dtos.ItemResponse:
    properties:
      bs:
        example: 7000
        type: number
      category_id:
        example: b01e3f7a-ff6e-45c0-842b-7f89ab48f9e2
        type: string
      description:
        example: Pizza mediana con jamón, piña y queso mozzarella sobre una base de
          salsa napolitana.
        type: string
      has_flavors:
        example: true
        type: boolean
      id:
        example: 7e441237-a818-42d2-bb54-9b8747198305
        type: string
      image:
        example: https://cdn.encargalo.app/items/pizza-hawaiana-mediana.jpg
        type: string
      name:
        example: Pizza Hawaiana Mediana
        type: string
      ref:
        example: 14
        type: number
      rules:
        items:
          $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.ItemRule'
        type: array
      score:
        example: 4.7
        type: number
      shop_id:
        example: d33aaf08-2c43-41c4-b2e7-882b019edb1e
        type: string
    type: object
  Encargalo_app-api_go_internal_products_domain_dtos.ItemRule:
    properties:
      id:
        example: 71c62783-820d-46f8-957d-c8d02db97264
        type: string
      item_id:
        example: 7e441237-a818-42d2-bb54-9b8747198305
        type: string
      rule_key:
        example: max_flavors
        type: string
      rule_value:
        example: 2
        type: integer
      selector_type:
        example: multi_select
        type: string
    type: object
  Encargalo_app-api_go_internal_products_domain_dtos.RegisterItem:
    properties:
      category_id:
        example: b01e3f7a-ff6e-45c0-842b-7f89ab48f9e2
        type: string
      description:
        example: Pizza mediana con jamón, piña y queso mozzarella sobre una base de
          salsa napolitana.
        type: string
      flavor_ids:
        example:
        - '["a1b2c3d4-e5f6-7890-abcd-ef1234567890"]'
        items:
          type: string
        type: array
      image:
        example: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEBLAEsAAD/4QC8RXhpZgAASUkqAAgAAAAGABIBAwABAAAAAQAAABoBBQABAAAAVgAAABsBBQABAAAAXgAAACgBAwABAAAAAgAAABMCAwABAAAA
        type: string
      name:
        example: Pizza Hawaiana Mediana
        type: string
      price:
        example: 32000
        type: integer
    required:
    - category_id
    - description
    - image
    - name
    - price
    type: object
  Encargalo_app-api_go_internal_products_domain_dtos.UpdateItem:
    properties:
      description:
        example: Pizza mediana con jamón, piña y queso mozzarella sobre una base de
          salsa napolitana.
        type: string
      flavor_ids:
        example:
        - '["a1b2c3d4-e5f6-7890-abcd-ef1234567890"]'
        items:
          type: string
        type: array
      image:
        example: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQ...
        type: string
      name:
        example: Pizza Hawaiana Mediana
        type: string
      price:
        example: 32000
        type: integer
    required:
    - description
    - name
    - price
    type: object
  Encargalo_app-api_go_internal_shops_domain_dtos.ShopResponse:
    properties:
      address:
        type: string
      banner:
        type: string
      delivery_fee:
        type: integer
      home_phone:
        type: string
      id:
        type: string
      latitude:
        type: number
      logo:
        type: string
      longitude:
        type: number
      name:
        type: string
      opened:
        type: boolean
      score:
        type: number
      tag:
        type: string
      time:
        type: integer
      type:
        type: string
    type: object
  Encargalo_app-api_go_internal_users_domain_dto.Address:
    properties:
      address:
        example: 'Calle 123 # 45-67'
        type: string
      extra: {}
      instructions:
        example: Tocar el timbre azul
        type: string
      label:
        example: Oficina
        type: string
      lat:
        example: 4.60971
        type: number
      long:
        example: -74.08175
        type: number
      type:
        example: Casa
        type: string
    required:
    - address
    - extra
    - label
    - lat
    - long
    - type
    type: object
  Encargalo_app-api_go_internal_users_domain_dto.CustomerResponse:
    properties:
      birthday_date:
        example: "1990-05-20"
        type: string
      email:
        example: carlos.ramirez@example.com
        type: string
      id:
        example: 123e4567-e89b-12d3-a456-426614174000
        type: string
      name:
        example: Carlos
        type: string
      phone:
        example: "+573001112233"
        type: string
      role:
        example: customer
        type: string
      sur_name:
        example: Ramírez
        type: string
    type: object
  Encargalo_app-api_go_internal_users_domain_dto.RegisterCustomer:
    properties:
      birthday_date:
        example: "1990-05-20"
        type: string
      email:
        example: carlos.ramirez@example.com
        type: string
      name:
        example: Carlos
        minLength: 3
        type: string
      password:
        example: claveSegura123
        minLength: 8
        type: string
      phone:
        example: "+573001112233"
        type: string
      sur_name:
        example: Ramírez
        minLength: 3
        type: string
    required:
    - birthday_date
    - name
    - password
    - phone
    - sur_name
    type: object
  Encargalo_app-api_go_internal_users_domain_dto.UpdateCustomer:
    properties:
      email:
        example: carlos.ramirez@example.com
        type: string
      name:
        example: Carlos
        minLength: 3
        type: string
      phone:
        example: "+573001112233"
        type: string
      sur_name:
        example: Ramírez
        minLength: 3
        type: string
    required:
    - name
    - phone
    - sur_name
    type: object
  Encargalo_app-api_go_internal_users_domain_dto.UpdatePassword:
    properties:
      password:
        example: claveSegura123
        minLength: 8
        type: string
    required:
    - password
    type: object
info:
  contact: {}
paths:
  /auth/logout:
    delete:
      description: Elimina la sesión activa identificada por session_id en la cookie
        de autenticación
      produces:
      - application/json
      responses:
        "200":
          description: session deleted success
          schema:
            type: string
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: unexpected error
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Cierra la sesión actual del cliente o empleado autenticado
      tags:
      - Auth
  /auth/sign-in/employees:
    post:
      consumes:
      - application/json
      description: |-
        Autentica a un empleado usando su número de teléfono y contraseña.
        Si las credenciales son correctas, se crea una sesión y se devuelve una cookie con un JWT.
      parameters:
      - description: Datos de inicio de sesión
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_auth_handler_request.SignInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: session created
          schema:
            type: string
        "400":
          description: Solicitud inválida (validación o JSON incorrecto)
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Credenciales incorrectas
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error inesperado del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión como empleado
      tags:
      - Auth
  /auth/sign-in/users:
    post:
      consumes:
      - application/json
      description: |-
        Autentica a un cliente usando su número de teléfono y contraseña.
        Si las credenciales son correctas, se crea una sesión y se devuelve una cookie con un JWT.
      parameters:
      - description: Datos de inicio de sesión
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_auth_handler_request.SignInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: session created
          schema:
            type: string
        "400":
          description: Solicitud inválida (validación o JSON incorrecto)
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Credenciales incorrectas
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error inesperado del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión como cliente
      tags:
      - Auth
  /orders:
    post:
      consumes:
      - application/json
      description: Creates a new order with the provided details
      parameters:
      - description: Order payload
        in: body
        name: order
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.CreateOrder'
      produces:
      - application/json
      responses:
        "201":
          description: Order created successfully
          schema:
            type: string
        "400":
          description: Invalid request body or validation failed
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.ErrorResponse'
        "409":
          description: Order already exists
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.ErrorResponse'
        "422":
          description: One or more items/additions not found
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.ErrorResponse'
        "500":
          description: Unexpected internal server error
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_orders_domain_dtos.ErrorResponse'
      summary: Create a new order
      tags:
      - Orders
  /orders/manager:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      - text/plain
      responses:
        "401":
          description: Sesión no encontrada o inválida
          schema:
            type: string
        "403":
          description: Acceso denegado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      summary: WebSocket de gestión de órdenes
      tags:
      - Orders WebSocket
  /products:
    get:
      description: Retorna todos los productos agrupados por categoría de una tienda.
        Solo incluye productos disponibles, ordenados por precio ascendente.
      parameters:
      - description: ID de la tienda
        format: uuid
        in: query
        name: shop_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.CategoryResponse'
            type: array
        "400":
          description: shop_id es requerido o inválido
          schema:
            type: string
        "404":
          description: Productos no encontrados
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      summary: Obtener productos por tienda
      tags:
      - Products
    post:
      consumes:
      - application/json
      description: Registra un nuevo producto en la tienda asociada al empleado autenticado.
        Si se envía `flavor_ids`, el producto se marcará automáticamente como con
        sabores y se asociarán los sabores indicados.
      parameters:
      - description: Datos del producto a registrar
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.RegisterItem'
      produces:
      - application/json
      responses:
        "201":
          description: product registered successfully
          schema:
            type: string
        "400":
          description: JSON inválido o campos faltantes
          schema:
            type: string
        "401":
          description: No autorizado
          schema:
            type: string
        "422":
          description: No se encontró la cuenta del empleado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - Cookie: []
      summary: Registrar un nuevo producto
      tags:
      - Products
  /products/{item_id}:
    put:
      consumes:
      - application/json
      description: Actualiza la información de un producto existente. Solo puede actualizarlo
        el Order Manager de la tienda a la que pertenece. La imagen solo se sube a
        Cloudinary si es diferente a la actual (comparación por hash). Si se envía
        `flavor_ids` (incluso vacío), los sabores se reemplazan completamente; si
        no se envía, los sabores no se modifican.
      parameters:
      - description: ID del producto
        format: uuid
        in: path
        name: item_id
        required: true
        type: string
      - description: Datos del producto a actualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.UpdateItem'
      produces:
      - application/json
      responses:
        "200":
          description: item update success
          schema:
            type: string
        "400":
          description: item_id inválido o JSON mal formado
          schema:
            type: string
        "401":
          description: No autorizado
          schema:
            type: string
        "404":
          description: Producto no encontrado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - Cookie: []
      summary: Actualizar un producto
      tags:
      - Products
  /products/additions:
    get:
      description: Retorna todas las adiciones disponibles de una categoría, ordenadas
        por precio ascendente.
      parameters:
      - description: ID de la categoría
        format: uuid
        in: query
        name: category_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.AdditionResponse'
            type: array
        "400":
          description: category_id es requerido o inválido
          schema:
            type: string
        "404":
          description: Adiciones no encontradas
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      summary: Obtener adiciones por categoría
      tags:
      - Products
  /products/best-sellers:
    get:
      consumes:
      - application/json
      description: Retorna todos los productos más vendidos de una tienda específica,
        ordenados por ventas descendente.
      parameters:
      - description: ID de la tienda
        format: uuid
        in: query
        name: shop_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.ItemResponse'
            type: array
        "400":
          description: shop_id es requerido o inválido
          schema:
            type: string
        "404":
          description: Productos más vendidos no encontrados
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      summary: Obtener los productos mas vendidos por tienda
      tags:
      - Products
  /products/flavors:
    get:
      description: Retorna todos los sabores disponibles asociados a un producto específico.
      parameters:
      - description: ID del producto
        format: uuid
        in: query
        name: item_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.FlavorResponse'
            type: array
        "400":
          description: item_id es requerido o inválido
          schema:
            type: string
        "404":
          description: Sabores no encontrados
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      summary: Obtener sabores por producto
      tags:
      - Products
  /products/flavors/category:
    get:
      description: Retorna todos los sabores disponibles asociados a una categoría
        específica.
      parameters:
      - description: ID de la categoría
        format: uuid
        in: query
        name: category_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.FlavorResponse'
            type: array
        "400":
          description: category_id es requerido o inválido
          schema:
            type: string
        "404":
          description: Sabores no encontrados
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      summary: Obtener sabores por categoría
      tags:
      - Products
  /shops:
    get:
      parameters:
      - description: Este es el ID del negocio, viene en formato UUID
        in: query
        name: id
        type: string
      - description: Este es el tag del negocio .ej:dmo
        in: query
        name: tag
        type: string
      - description: 'Latitud del usuario .ej: 4.678034'
        in: query
        name: lat
        required: true
        type: number
      - description: 'Longitud del usuario .ej: -74.0496399'
        in: query
        name: lon
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_shops_domain_dtos.ShopResponse'
            type: array
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: End Point para obtener un negocio con todos sus products, se debe enviar
        alguno de los 2 query params requeridos.
      tags:
      - Shops
  /shops/all:
    get:
      parameters:
      - description: 'Latitud del usuario .ej: 4.678034'
        in: query
        name: lat
        required: true
        type: number
      - description: 'Longitud del usuario .ej: -74.0496399'
        in: query
        name: lon
        required: true
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_shops_domain_dtos.ShopResponse'
            type: array
        "404":
          description: Not Found
        "500":
          description: Internal Server Error
      summary: Para que no me fastidies de cual es la ruta
      tags:
      - Shops
  /users:
    get:
      description: Retorna los datos del cliente identificado por el customer_id contenido
        en el token
      produces:
      - application/json
      responses:
        "200":
          description: Datos del cliente
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_users_domain_dto.CustomerResponse'
        "404":
          description: not found
          schema:
            type: string
        "500":
          description: unexpected error
          schema:
            type: string
      summary: Obtiene la información del cliente autenticado
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Registrar un nuevo cliente en el sistema con los datos proporcionados.
        Valida campos obligatorios como nombre, teléfono y contraseña.
      parameters:
      - description: Datos del cliente
        in: body
        name: customer
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_users_domain_dto.RegisterCustomer'
      responses:
        "201":
          description: customer successfully registered
          schema:
            type: string
        "400":
          description: Se retorna cuando hay un campo que no cumple con los requisitos
            o directamente el body se envía vacío.
          schema:
            type: string
        "409":
          description: Se retorna cuando el teléfono ya está registrado.
          schema:
            type: string
        "500":
          description: Se retorna cuando ocurre un error inexperado en el servidor.
          schema:
            type: string
      summary: Registrar un nuevo cliente
      tags:
      - Users
    put:
