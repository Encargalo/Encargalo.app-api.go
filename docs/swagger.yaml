info:
  contact: {}
paths:
  /auth/logout:
    delete:
      description: Elimina la sesión activa del cliente o empleado autenticado y borra
        la cookie de autenticación.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth_handler.LogoutResponse'
        "401":
          description: No autorizado
          schema:
            type: string
        "404":
          description: Sesión no encontrada
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Cerrar sesión
      tags:
      - Auth
  /auth/sign-in/employees:
    post:
      consumes:
      - application/json
      description: |-
        Autentica a un empleado usando su número de teléfono y contraseña.
        Si las credenciales son correctas, se crea una sesión y se devuelve una cookie con un JWT.
      parameters:
      - description: Datos de inicio de sesión
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_auth_handler_request.SignInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: session created
          schema:
            type: string
        "400":
          description: Solicitud inválida (validación o JSON incorrecto)
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Credenciales incorrectas
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Demasiados intentos, intenta de nuevo más tarde
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error inesperado del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión como empleado
      tags:
      - Auth
  /auth/sign-in/google:
    post:
      consumes:
      - application/json
      description: |-
        Verifica un id_token de Google emitido por la app móvil. Si el email ya
        pertenece a un customer, inicia sesión; si no existe, crea la cuenta
        automáticamente (sin teléfono, que se completa luego desde el perfil).
        Si las credenciales son correctas, se crea una sesión y se devuelve una cookie con un JWT.
      parameters:
      - description: id_token de Google
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_auth_handler_request.SignInGoogleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: session created
          schema:
            type: string
        "400":
          description: Solicitud inválida (validación o JSON incorrecto)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: id_token inválido o expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Demasiados intentos, intenta de nuevo más tarde
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error inesperado del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión o registrarse con Google
      tags:
      - Auth
  /auth/sign-in/riders:
    post:
      consumes:
      - application/json
      description: |-
        Autentica a un rider usando su número de teléfono y contraseña.
        Si las credenciales son correctas, se crea una sesión y se devuelve una cookie con un JWT.
      parameters:
      - description: Datos de inicio de sesión
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_auth_handler_request.SignInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: session created
          schema:
            type: string
        "400":
          description: Solicitud inválida (validación o JSON incorrecto)
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Credenciales incorrectas
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Demasiados intentos, intenta de nuevo más tarde
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error inesperado del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión como rider
      tags:
      - Auth
  /auth/sign-in/staff:
    post:
      consumes:
      - application/json
      description: |-
        Autentica a un miembro del staff (CRM) usando teléfono y contraseña.
        Si las credenciales son correctas, se crea una sesión y se devuelve una cookie con un JWT.
      parameters:
      - description: Datos de inicio de sesión
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_auth_handler_request.SignInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: session created
          schema:
            type: string
        "400":
          description: Solicitud inválida (validación o JSON incorrecto)
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Credenciales incorrectas
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Demasiados intentos, intenta de nuevo más tarde
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error inesperado del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión como staff
      tags:
      - Auth
  /auth/sign-in/users:
    post:
      consumes:
      - application/json
      description: |-
        Autentica a un cliente usando su número de teléfono y contraseña.
        Si las credenciales son correctas, se crea una sesión y se devuelve una cookie con un JWT.
      parameters:
      - description: Datos de inicio de sesión
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_auth_handler_request.SignInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: session created
          schema:
            type: string
        "400":
          description: Solicitud inválida (validación o JSON incorrecto)
          schema:
            additionalProperties:
              type: string
            type: object
        "422":
          description: Credenciales incorrectas
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Demasiados intentos, intenta de nuevo más tarde
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Error inesperado del servidor
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Iniciar sesión como cliente
      tags:
      - Auth
  /bcv/rate:
    get:
      description: Retorna la última tasa de cambio USD/Bs publicada por el BCV, cacheada
        por el servidor.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_bcv_domain_models.ExchangeRate'
        "401":
          description: token inválido
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Obtener tasa del dólar en bolívares
      tags:
      - Bcv
  /business/products:
    get:
      description: Retorna todos los productos agrupados por categoría del negocio
        asociado a la sesión autenticada.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.CategoryResponse'
            type: array
        "401":
          description: No autorizado
          schema:
            type: string
        "404":
          description: Productos no encontrados
          schema:
            type: string
        "422":
          description: El usuario no tiene un negocio asociado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Obtener productos del negocio
      tags:
      - Business
  /business/products/{item_id}:
    put:
      consumes:
      - application/json
      description: 'Actualiza un producto. `availability_status`: active|hidden|out_of_stock.
        Si es un item de la macro Adiciones, sincroniza name/price/available en los
        productos que lo referencian. `addition_ids` asigna adiciones (max selección
        5).'
      parameters:
      - description: ID del producto
        format: uuid
        in: path
        name: item_id
        required: true
        type: string
      - description: Datos del producto a actualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.UpdateItem'
      produces:
      - application/json
      responses:
        "200":
          description: item update success
          schema:
            type: string
        "400":
          description: item_id inválido o JSON mal formado
          schema:
            type: string
        "401":
          description: No autorizado
          schema:
            type: string
        "404":
          description: Producto no encontrado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Actualizar un producto
      tags:
      - Business
  /business/products/additions/catalog:
    get:
      description: Retorna los items del negocio cuya categoría tiene macro `adiciones`.
        Usar al crear/editar un producto para seleccionar `addition_ids`.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.AdditionResponse'
            type: array
        "401":
          description: No autorizado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Catálogo de adiciones del negocio
      tags:
      - Business
  /business/products/categories:
    get:
      description: Retorna todas las categorías del negocio autenticado con `details`
        (flavors, selector_type), `availability_status`, `macro_category_id` y `schedules`.
        No incluye items (usar `GET /business/products` para el catálogo con productos).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.CategoryResponse'
            type: array
        "401":
          description: No autorizado
          schema:
            type: string
        "404":
          description: Categorías no encontradas
          schema:
            type: string
        "422":
          description: El usuario no tiene un negocio asociado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Listar categorías completas del negocio
      tags:
      - Business
    post:
      consumes:
      - application/json
      description: Registra una nueva categoría. Puede incluir `flavors` (name/description);
        el backend genera el `id` de cada sabor y lo guarda en `details.flavors`.
        Si hay sabores, `selector_type` debe ser `single_select` (cantidad 1 por sabor;
        min/max = sabores distintos) o `multi_select` (cantidad N del mismo sabor).
      parameters:
      - description: Datos de la categoría a registrar
        in: body
        name: category
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.RegisterCategory'
      produces:
      - application/json
      responses:
        "201":
          description: category registered successfully
          schema:
            type: string
        "400":
          description: JSON inválido o campos faltantes
          schema:
            type: string
        "401":
          description: No autorizado
          schema:
            type: string
        "422":
          description: El usuario no tiene un negocio asociado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Registrar una nueva categoría
      tags:
      - Business
  /business/products/categories/{category_id}:
    put:
      consumes:
      - application/json
      description: Actualiza el nombre, macro-categoría, `availability_status` (`active`
        | `hidden` | `out_of_stock`) y/o horario de una categoría existente. Enviar
        `schedules` reemplaza todo el horario; omitirlo lo deja sin cambios; `[]`
        elimina el horario.
      parameters:
      - description: ID de la categoría
        format: uuid
        in: path
        name: category_id
        required: true
        type: string
      - description: Datos de la categoría a actualizar
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.UpdateCategory'
      produces:
      - application/json
      responses:
        "200":
          description: category update success
          schema:
            type: string
        "400":
          description: category_id inválido o JSON mal formado
          schema:
            type: string
        "401":
          description: No autorizado
          schema:
            type: string
        "404":
          description: Categoría no encontrada
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Actualizar una categoría
      tags:
      - Business
  /business/products/categories/summary:
    get:
      description: Retorna solo id y nombre de cada micro categoría del negocio. Use
        `for=flavors` o `for=additions` (macro Adiciones).
      parameters:
      - description: Filtrar categorías elegibles
        enum:
        - flavors
        - additions
        in: query
        name: for
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_products_domain_dtos.CategorySummaryResponse'
            type: array
        "401":
          description: No autorizado
          schema:
            type: string
        "422":
          description: El usuario no tiene un negocio asociado
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Listar categorías del negocio (resumen)
