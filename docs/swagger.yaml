        a que el staff resuelva el comprobante. Si se pagó con balance, el débito
        se reintegra. Si el Pago Móvil ya estaba aprobado (searching, accepted o arriving),
        se acredita la tarifa en Bs a la cartera y la respuesta trae payment.transaction_id.'
