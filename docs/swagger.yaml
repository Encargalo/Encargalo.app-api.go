        Móvil (`cash_amount_bs`). Los tres juntos se rechazan. Si hay Pago Móvil hace
        falta comprobante y la orden nace en Payment Review. Efectivo + saldo no lleva
        comprobante y nace en Pending; el rider cobra solo la parte en efectivo.'
