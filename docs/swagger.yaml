info:
  contact: {}
paths:
  /auth/logout:
    delete:
      description: Elimina la sesión activa del cliente o empleado autenticado y borra
        la cookie de autenticación.
      produces:
      - application/json
      responses:
        "200":
          description: session deleted success
          schema:
            type: string
        "401":
          description: No autorizado
          schema:
            type: string
        "404":
          description: Sesión no encontrada
          schema:
            type: string
        "500":
          description: Error interno del servidor
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Cerrar sesión
      tags:
      - Auth
  /auth/sign-in/employees:
    post:
      consumes:
      - application/json
      description: |-
        Autentica a un empleado usando su número de teléfono y contraseña.
        Si las credenciales son correctas, se crea una sesión y se devuelve una cookie con un JWT.
      parameters:
      - description: Datos de inicio de sesión
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_auth_handler_request.SignInRequest'
      produces:
      - application/json
      responses:
        "201":
          description: session created
          schema:
            type: string
