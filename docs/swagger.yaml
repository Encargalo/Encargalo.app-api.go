        de la ruta. Fuera de producción no llama a Google: devuelve una línea recta
        entre los dos puntos con la distancia en línea recta y duration_min en 0.'
      parameters:
      - description: Latitud de origen
        in: query
        name: origin_lat
        required: true
        type: number
      - description: Longitud de origen
        in: query
        name: origin_lng
        required: true
        type: number
      - description: Latitud de destino
        in: query
        name: dest_lat
        required: true
        type: number
      - description: Longitud de destino
        in: query
