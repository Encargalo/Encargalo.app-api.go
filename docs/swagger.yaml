        usando la Google Places Details API. Incluye address, lat/lng, parts (locality=ciudad,
        administrative_area_level_1=estado, administrative_area_level_2=municipio/provincia)
        y address_components crudos de Google para que el cliente arme la dirección.
        Cacheado por el servidor por place_id.
