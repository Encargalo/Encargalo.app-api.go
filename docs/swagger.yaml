  /users/balance:
    get:
      description: Retorna balance_bs y balance_usd (tasa BCV vigente en bcv_rate)
        y los últimos 10 movimientos (amount_bs y amount_usd). Créditos elegibles
        incluyen refundable_pm_bs, can_request_refund (ventana/monto > $1 equivalente
        en Bs a la tasa congelada/saldo; no exige Pago Móvil) y refund_eligible_until.
        Un movimiento de orden trae order_id; uno de viaje trae trip_id. Los débitos
        de devolución (balance_refund_hold / processing / payout) y créditos balance_refund_restore
        incluyen refund_request_id para abrir el detalle.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_users_domain_dto.CustomerBalanceResponse'
        "401":
          description: No autorizado
          schema:
            type: string
        "500":
          description: Error interno
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Balance del cliente
      tags:
      - Users Finance
  /users/balance/refund-requests:
    get:
      description: Lista las solicitudes de devolución del cliente autenticado.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/Encargalo_app-api_go_internal_users_domain_dto.RefundRequestResponse'
            type: array
        "401":
          description: No autorizado
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Listar solicitudes de devolución
      tags:
      - Users Finance
    post:
      consumes:
      - application/json
      description: Solicita devolución en efectivo de la porción Pago Móvil de un
        crédito elegible (> $1, ventana 15 min). Requiere Pago Móvil registrado. La
        respuesta trae order_id o trip_id según el crédito.
      parameters:
      - description: transaction_id del crédito
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/Encargalo_app-api_go_internal_users_domain_dto.CreateRefundRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/Encargalo_app-api_go_internal_users_domain_dto.RefundRequestResponse'
        "401":
          description: No autorizado
          schema:
            type: string
        "409":
          description: Ya existe solicitud
          schema:
            type: string
        "422":
          description: No elegible / sin PM
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Solicitar devolución de crédito
      tags:
      - Users Finance
