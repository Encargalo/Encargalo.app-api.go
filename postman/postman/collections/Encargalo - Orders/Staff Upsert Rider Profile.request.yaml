description: Upsert parcial expediente. Fotos como data-URL base64. Cookie + rol Staff.
url: "{{base_url}}/riders/staff/profiles/:userId"
method: PUT
header:
  - key: Content-Type
    value: application/json
body:
  mode: raw
  raw: |-
    {
      "vehicle_type": "moto",
      "vehicle_plate": "AB123CD",
      "notes": "Falta licencia",
      "id_photo": "data:image/jpeg;base64,/9j/4AAQ..."
    }
