$kind: http-request
description: "El rider introduce el código de 4 dígitos que le muestra el usuario. Si el código es válido, el pedido pasa de 'On The Way' a 'Completed'. Requiere cookie `encargalo-session`. Rol: Rider. El pedido debe estar asignado al rider autenticado (401 si no). Rate limit: 10 intentos/min por IP."
url: "{{base_url}}/orders/:id/confirm-delivery"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    description: UUID del pedido
body:
  type: json
  content: |-
    {
      "code": "5678"
    }
order: 7000
