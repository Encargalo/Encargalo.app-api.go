$kind: http-request
description: "Retorna el producto más vendido de cada local abierto dentro de un radio de 1 km. Máximo 10 resultados, excluyendo productos cuya categoría tiene un horario configurado que no cubre la hora actual (America/Caracas). Cacheado 15 minutos. Cada `shop` incluye `delivery_fee`, `delivery_fee_bs` y `time` (minutos estimados) calculados con la distancia real entre `lat`/`lon` y el local, igual que en `/shops`. Requiere cookie `encargalo-session`. Rol: Customer."
url: "{{base_url}}/products/trending?lat=10.4806&lon=-66.9036"
method: GET
queryParams:
  - key: lat
    value: "10.4806"
    description: Latitud del usuario
  - key: lon
    value: "-66.9036"
    description: Longitud del usuario
order: 15000
