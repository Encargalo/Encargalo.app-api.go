$kind: http-request
description: "Registra un descuento propio del negocio (porcentaje o monto fijo) sobre un producto de la tienda del empleado autenticado. `shop_id` se obtiene automáticamente de la sesión. Solo puede existir un descuento activo por producto. `starts_at`/`ends_at` son opcionales: si se omiten, el descuento no tiene ventana de vigencia y depende únicamente de `is_active`. Este descuento se compone con la promo de lanzamiento de la plataforma (día 1): se aplica primero sobre el precio de catálogo, y luego, si el negocio está en su ventana de día 1, la promo de plataforma se aplica sobre ese precio ya rebajado. Requiere cookie `encargalo-session`. Rol: Order Manager / Owner."
url: "{{base_url}}/business/products/discounts"
method: POST
