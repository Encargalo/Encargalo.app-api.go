$kind: http-request
description: Crea o actualiza el Pago Móvil destino del customer. Requerido antes de solicitar devoluciones. Cookie + rol Customer.
url: "{{base_url}}/users/pago-movil"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "phone": "+584121234567",
      "bank_code": "0102",
      "national_id": "V12345678"
    }
order: 5000
